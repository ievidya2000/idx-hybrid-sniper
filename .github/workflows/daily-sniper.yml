name: daily-sniper

on:
  schedule:
    # 10:20 WIB -> results ~10:30-10:35 (live session 1)
    - cron: "20 3 * * 1-5"
    # 12:20 WIB -> results ~12:30-12:35 (live session 2)
    - cron: "20 5 * * 1-5"
    # 13:50 WIB -> results ~14:00-14:05 (live session 3)
    - cron: "50 6 * * 1-5"
    # 17:15 WIB -> EOD final report
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

jobs:
  update-and-scan:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "curl_cffi>=0.15"

      - name: Lightning update market data (batch parallel)
        run: python -c "from src.fast_update import run_lightning_update as r; print('STATS:', r())"

      - name: Scan for signals
        run: python main.py scan

      - name: Send Rich Telegram Report
        if: always()
        run: python src/telegram_notifier.py
