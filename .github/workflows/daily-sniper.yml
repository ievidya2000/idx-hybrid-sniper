name: daily-sniper

on:
  schedule:
    # 10:20 WIB -> report ~10:30
    - cron: "20 3 * * 1-5"
    # 12:20 WIB -> report ~12:30
    - cron: "20 5 * * 1-5"
    # 13:50 WIB -> report ~14:00
    - cron: "50 6 * * 1-5"
    # 17:15 WIB -> EOD report ~17:25
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

jobs:
  update-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "curl_cffi>=0.15"

      - name: Lightning update (parallel, 6-min deadline)
        run: python -c "from src.fast_update import run_lightning_update as r; print('STATS:', r())"

      - name: Scan for signals (DB-only, FAST - bypasses main.py hidden update)
        run: |
          python - << 'PY'
          from src.strategy import strategy
          from src.data_engine import data_engine
          tickers = data_engine.get_tickers()
          sigs = strategy.scan_tickers(tickers, data_engine)
          n = len([s for s in sigs if s.signal_type != 'NO_SIGNAL'])
          print('SCAN_DONE signals=', n)
          PY

      - name: Send Rich Telegram Report
        if: always()
        run: python src/telegram_notifier.py
