name: daily-sniper

on:
  schedule:
    # 10:20 WIB
    - cron: "20 3 * * 1-5"
    # 12:20 WIB
    - cron: "20 5 * * 1-5"
    # 13:50 WIB
    - cron: "50 6 * * 1-5"
    # 17:15 WIB
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

jobs:
  update-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "curl_cffi>=0.15"

      - name: Lightning update v7 (fetch 6-min cap + bulk save)
        run: |
          timeout -k 15 660 python -c "from src.fast_update import run_lightning_update as r; r(hard_exit=True)" || echo "UPDATE GUARD TRIGGERED - continuing with saved data"

      - name: RAM scan v1.1 (ONE bulk query, CPU only, 15-min guard)
        run: |
          timeout -k 10 900 python -c "from src.ram_scan import run_ram_scan as s; s()" || echo "SCAN GUARD TRIGGERED"

      - name: Send Rich Telegram Report (reads scan_out.json, no re-scan)
        if: always()
        run: python src/telegram_notifier.py
